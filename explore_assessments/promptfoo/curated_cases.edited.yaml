- description: 'Battle of the Nudes'
  vars:
    case_id: '1967.127'
    image_filename: '1967.127_web.jpg'
    image_path: '../curated_images/1967.127_web.jpg'
    mime_type: image/jpeg
    ideal_alt_text: >-
      A horizontally oriented engraving depicts many muscular nude men violently fighting,
      some with swords, daggers, and other various weapons. In the background, there is
      foliage.
  assert:
    - type: icontains-all
      value:
        - 'nude'
        - 'OPUS'
        - 'ANTONII-POLLA'
        - 'IOU'
        - 'FLORENT'
        - 'TINI'
      metric: required-content
    - type: icontains-any
      value:
        - 'engraving'
        - 'etching'
      metric: required-content
    - type: icontains-any
      value:
        - 'men'
        - 'male'
      metric: required-content
    - type: icontains-any
      value:
        - 'fight'
        - 'battle'
        - 'combat'
        - 'melee'
      metric: required-content
    - type: javascript
      # Require "weapons" or at least two distinct named weapon types.
      value: |-
        output.toLowerCase().includes('weapons') || ['sword', 'axes', 'bow', 'arrows', 'daggers'].filter(
          term => output.toLowerCase().includes(term)
        ).length >= 2
      metric: required-weapons
    - type: icontains-any
      value:
        - 'sign'
        - 'plaque'
      metric: required-content
    - type: javascript
      value: >-
        Array.from(output.trim()).length <= 200
      metric: maximum-200-characters

