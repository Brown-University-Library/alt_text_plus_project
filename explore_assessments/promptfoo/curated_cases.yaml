# Curated image cases extracted from ../good_alt_text.md.
# Required-content terms are deterministic starting points; calibrate and revise them
# when a visually correct description uses reasonable alternate wording.

- description: 'Raft Cup'
  vars:
    case_id: '1977.7'
    image_filename: '1977.7_web.jpg'
    image_path: '../curated_images/1977.7_web.jpg'
    mime_type: image/jpeg
    ideal_alt_text: >-
      A silver cup is shaped like a man riding down a river. The man has a naked torso and
      sits at the lip of the cup, his head tilted back. The waves envelop each side of the cup
      and its upturned tip.
  assert:
    - type: icontains-all
      value:
        - 'silver cup'
        - 'man'
        - 'waves'
      metric: required-content
    - type: javascript
      value: Array.from(output.trim()).length <= 200
      metric: maximum-200-characters

